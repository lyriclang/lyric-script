# The diagnostic catalog of the Lyric-Script toolchain: every code it reports, in code order.
# The form of an entry is Lyric 5's (src/Lyric.Core/diagnostics.toml in lyriclang/lyric): title,
# severity, area (the chapter of the specification on lyric-spec's script branch), summary,
# explanation, example. Codes carry the prefix LYS-; a guard that holds this file against the
# toolchain comes with S11.

[LYS-CAP0001]
title = "a right the run was not given"
severity = "error"
area = "17-host"
summary = "A module the script imports belongs to a class of rights — file, net, process, os, native — that the run was not given. Every missing right is reported at once, with the import that asks; `--allow` gives classes, `-A` all, and at a terminal the run asks once before the start. The exit code is 2. Lyric-Script's own (design/v1, 01 S1, S4)."

[LYS-CLI0001]
title = "an unknown command"
severity = "error"
area = "14-cli"
summary = "Reported when the first argument of `lyric-script` names no command. The exit code is 2."
explanation = '''
`lyric-script` takes a command as its first argument. A word it does not know stops it before
anything runs; `lyric-script help` lists the commands there are.
'''
example = '''
$ lyric-script frobnicate
error[LYS-CLI0001]: unknown command 'frobnicate'
  = help: lyric-script help lists the commands
'''

[LYS-ICE0001]
title = "the VM failed"
severity = "panic"
area = "17-host"
summary = "A fault of the Lyric-Script VM itself, not of the script: the VM's task ended by a panic of Lyric 5 or without a result. The host gets it as a panic; the VM stays usable. Worth a report."

[LYS-RT0001]
title = "integer division by zero"
severity = "panic"
area = "08-expressions"
summary = "An integer `/` or `%` has a zero divisor. The code and its meaning are Lyric 5's LYR-RT0001."

[LYS-RT0002]
title = "integer overflow"
severity = "panic"
area = "08-expressions"
summary = "An `int` operation's result does not fit 64 bits. The code and its meaning are Lyric 5's LYR-RT0002."

[LYS-RT0003]
title = "an index or a range out of bounds"
severity = "panic"
area = "08-expressions"
summary = "A list read or written at an index it does not have: below 0, or at its length or above. The code and its meaning are Lyric 5's LYR-RT0003."

[LYS-RT0004]
title = "a null value used"
severity = "panic"
area = "03-types"
summary = "An optional unwrapped with `!` where it is null, or a field of `null` read or written. The code and its meaning are Lyric 5's LYR-RT0004."

[LYS-RT0006]
title = "stack overflow"
severity = "panic"
area = "17-host"
summary = "The script's calls nest deeper than the VM runs (10 000 frames). The code and its meaning are Lyric 5's LYR-RT0006."

[LYS-RT0008]
title = "panic called by the script"
severity = "panic"
area = "06-errors"
summary = "The script called `panic` with a message. The code and its meaning are Lyric 5's LYR-RT0008."

[LYS-ASM0001]
title = "a line of assembly text that cannot be read"
severity = "error"
area = "14-cli"
summary = "Reported by `lyric-script asm` for a .lyrsasm file with a faulty line: an unknown operation, a wrong number of operands, a missing label or function, a function without `end`. The message names the line. The exit code is 1."

[LYS-ASM0002]
title = "assembled code with a fault in its structure"
severity = "error"
area = "14-cli"
summary = "Reported by `lyric-script asm` when the assembled module fails the structure check: a register outside its file, a jump past the code, a call past the registers, a return of the wrong kind. The message names the function and the instruction. The exit code is 1."

[LYS-CLI0002]
title = "a command with the wrong arguments"
severity = "error"
area = "14-cli"
summary = "Reported when a command gets more or fewer arguments than it takes. The exit code is 2."

[LYS-CLI0003]
title = "a file that cannot be read"
severity = "error"
area = "14-cli"
summary = "Reported when a command cannot read the file it is given. The exit code is 2."

# The lexer (S2b). A code means what Lyric 5's LYR-LEX code of the same number means;
# Lyric-Script's own codes start at 0900.

[LYS-LEX0001]
title = "a character that starts no token, or a name beyond ASCII"
severity = "error"
area = "01-lexical"
summary = "The source holds a character that begins no token (`$`, a backtick, a control character), or a word holding characters beyond ASCII. A word beyond ASCII is refused once and read as the name it would be. Lyric 5's LYR-LEX0001."
explanation = '''
A name is written in ASCII: letters, digits and `_`, not starting with a digit. Characters beyond
ASCII may stand in strings, characters and comments, never in a name. Spell the name in ASCII, or
put the character into a string or a comment.
'''
example = '''
$ lyric-script check sizes.lyrs
error[LYS-LEX0001]: a name beyond ASCII: 'größe'
  --> sizes.lyrs:1:5
'''

[LYS-LEX0002]
title = "a block comment that is not closed"
severity = "error"
area = "01-lexical"
summary = "A `/*` has no matching `*/` before the end of the file; block comments nest, so each `/*` needs its own. Lyric 5's LYR-LEX0002."

[LYS-LEX0003]
title = "a number with a suffix"
severity = "error"
area = "01-lexical"
summary = "Letters follow a number: `1u8`, `2.0f32`. Lyric 5 gives a literal its width by a suffix; Lyric-Script has one integer type and one float type and no suffix (design/v1 03 K3). The meaning is Lyric 5's LYR-LEX0003, with every suffix refused."

[LYS-LEX0004]
title = "a base prefix with no digits after it"
severity = "error"
area = "01-lexical"
summary = "`0x`, `0o` or `0b` stands without a digit after it. Lyric 5's LYR-LEX0004."

[LYS-LEX0005]
title = "a digit separator right after a base prefix"
severity = "error"
area = "01-lexical"
summary = "`_` follows `0x`, `0o` or `0b` directly: `0x_ff`. A separator stands among and after the digits, not before the first. Lyric 5's LYR-LEX0005."

[LYS-LEX0006]
title = "an exponent with no digits"
severity = "error"
area = "01-lexical"
summary = "An `e` or `E` after a number, with an optional sign, has no digits after it: `1e`, `2e+`. Lyric 5's LYR-LEX0006."

[LYS-LEX0009]
title = "a string literal that is not closed"
severity = "error"
area = "01-lexical"
summary = "A string has no closing quote on its line, or a `\"\"\"` string none before the end of the file. Lyric 5's LYR-LEX0009."

[LYS-LEX0010]
title = "a character literal that is not closed"
severity = "error"
area = "01-lexical"
summary = "A `'` opens a character literal that has no closing `'` on its line. Lyric 5's LYR-LEX0010."

[LYS-LEX0011]
title = "an f-string that is not closed"
severity = "error"
area = "01-lexical"
summary = "An `f\"…\"` has no closing quote on its line, or one of its holes no closing `}`. A hole stays on one line. Lyric 5's LYR-LEX0011."

[LYS-LEX0016]
title = "a float literal without digits on one side of its point"
severity = "error"
area = "01-lexical"
summary = "`1.` or `.5`: a digit stands on both sides of a float's point. The literal is refused once and read as the float it means. `3.show()` is a call and `1..3` a range; after an operand `.5` names a tuple's element. Lyric 5's LYR-LEX0016."

[LYS-LEX0900]
title = "a frontmatter block that is not closed"
severity = "error"
area = "01-lexical"
summary = "A script opens with a `---` line (after an optional `#!` line) and no second `---` line closes the block. The frontmatter holds the script's dependencies in TOML (design/v1 09 Hd)."
example = '''
#!/usr/bin/env lyric-script
---
[dependencies]
csv = "1"
---
println("hello")
'''

[LYS-LEX0901]
title = "a line that starts with a sign"
severity = "warning"
area = "01-lexical"
summary = "A line starts with `+` or `-` after a line that ended a statement. The line end ends the statement, so the sign starts a new one — rarely what was meant. To go on with the line before, put the operator at its end (design/v1 09 NL rule 4)."
explanation = '''
A line end ends a statement unless the line asks for more (it ends in an operator, `=`, `,`, `.`,
an opening bracket …) or the next line cannot start one (it begins with `.`, `else`, `)` …).
`+` and `-` can start a statement, as signs, so a line beginning with them is read as a new one:

    let total = price
        - discount        // a statement of its own: -discount, thrown away

Write the operator at the end of the line instead:

    let total = price -
        discount
'''

# The rest of the lexer's codes (S2c: the literals are read by the parser).

[LYS-LEX0007]
title = "a malformed escape sequence"
severity = "error"
area = "01-lexical"
summary = "A backslash in a string or a character starts no escape there: the escapes are `\\n`, `\\r`, `\\t`, `\\\\`, `\\'`, `\\\"`, `\\0` and `\\u{…}` with one to eight hex digits naming a scalar value. Lyric 5's LYR-LEX0007."

[LYS-LEX0008]
title = "a character literal that holds no character or several"
severity = "error"
area = "01-lexical"
summary = "A character literal holds exactly one Unicode scalar value, written or escaped. Lyric 5's LYR-LEX0008."

[LYS-LEX0012]
title = "a byte string holding no byte"
severity = "error"
area = "01-lexical"
summary = "A byte string holds ASCII text and escapes; a character beyond ASCII and `\\u{…}` name no byte. Lyric 5's LYR-LEX0012."

[LYS-LEX0013]
title = "a byte escape in a string or character"
severity = "error"
area = "01-lexical"
summary = "`\\xNN` is a byte's escape and stands in a byte string alone; a character is `\\u{…}`. Lyric 5's LYR-LEX0013."

[LYS-LEX0014]
title = "a multi-line string whose quotes do not stand on lines of their own"
severity = "error"
area = "01-lexical"
summary = "The text of a `\"\"\"` string begins on the line after the opening quotes and ends with the line before the closing ones, which stand on a line of their own. Lyric 5's LYR-LEX0014."

[LYS-LEX0015]
title = "a line of a multi-line string indented less than its closing quotes"
severity = "error"
area = "01-lexical"
summary = "The closing line's indentation is taken off every line; a line with less of it is refused (a blank one need not have it). Lyric 5's LYR-LEX0015."

# The parser (S2c). A code means what Lyric 5's LYR-PAR code of the same number means;
# Lyric-Script's own codes start at 0900.

[LYS-PAR0001]
title = "a token after one whole statement"
severity = "error"
area = "02-grammar"
summary = "A statement ends at a line end, at `;`, or before the `}` that closes it; something else follows it here. Lyric 5's LYR-PAR0001."

[LYS-PAR0002]
title = "an expression is missing"
severity = "error"
area = "02-grammar"
summary = "An expression is expected where the parser found something else. Lyric 5's LYR-PAR0002."

[LYS-PAR0003]
title = "a member name is missing"
severity = "error"
area = "02-grammar"
summary = "A `.` or `?.` is followed by no name. Lyric 5's LYR-PAR0003."

[LYS-PAR0004]
title = "a ']' is missing"
severity = "error"
area = "02-grammar"
summary = "An index or a collection literal is not closed by `]`. Lyric 5's LYR-PAR0004."

[LYS-PAR0005]
title = "range operators chained"
severity = "error"
area = "02-grammar"
summary = "`a..b..c`: a range has two ends. Lyric 5's LYR-PAR0005."

[LYS-PAR0007]
title = "a numeric literal too large"
severity = "error"
area = "02-grammar"
summary = "An integer literal beyond `int`'s range (64 bits, signed). Lyric 5's LYR-PAR0007."

[LYS-PAR0008]
title = "a parenthesis is missing"
severity = "error"
area = "02-grammar"
summary = "A `(` or `)` is expected: around a condition, the parameters or the arguments. Lyric 5's LYR-PAR0008."

[LYS-PAR0009]
title = "an angle bracket of a type list is missing"
severity = "error"
area = "02-grammar"
summary = "A list of type arguments, `List<int>`, is not closed by `>`. Lyric 5's LYR-PAR0009."

[LYS-PAR0010]
title = "a tuple of fewer than two elements, or a label given twice"
severity = "error"
area = "03-types"
summary = "`(1,)` or `(int,)`: a tuple has two elements or more, one value in parentheses is a grouping; and a tuple type gives each label once. Lyric 5's LYR-PAR0010."

[LYS-PAR0011]
title = "a type is missing"
severity = "error"
area = "02-grammar"
summary = "A type is expected where the parser found something else. Lyric 5's LYR-PAR0011."

[LYS-PAR0014]
title = "an interpolation not closed by '}'"
severity = "error"
area = "02-grammar"
summary = "A hole of an f-string holds one expression, closed by `}`. Lyric 5's LYR-PAR0014."

[LYS-PAR0015]
title = "a function type without '->'"
severity = "error"
area = "02-grammar"
summary = "`fn(A, B) -> C`: a function type names its result after `->`. Lyric 5's LYR-PAR0015."

[LYS-PAR0017]
title = "a '{' is missing, or a body without braces"
severity = "error"
area = "02-grammar"
summary = "A body is a block in braces. Lyric 5's LYR-PAR0017."

[LYS-PAR0018]
title = "a '}' is missing"
severity = "error"
area = "02-grammar"
summary = "A block or a body is not closed. Lyric 5's LYR-PAR0018."

[LYS-PAR0019]
title = "a '(' is missing after a keyword"
severity = "error"
area = "02-grammar"
summary = "`if`, `while` and `for` take their head in parentheses. Lyric 5's LYR-PAR0019."

[LYS-PAR0020]
title = "a binding without its name"
severity = "error"
area = "02-grammar"
summary = "`let` and `var` are followed by the name they bind. Lyric 5's LYR-PAR0020."

[LYS-PAR0021]
title = "a for loop without 'in'"
severity = "error"
area = "02-grammar"
summary = "`for (x in xs)`: the loop variable, `in`, then what it runs over. Lyric 5's LYR-PAR0021."

[LYS-PAR0026]
title = "a name is missing"
severity = "error"
area = "02-grammar"
summary = "A declaration, a parameter or a field needs its name here. Lyric 5's LYR-PAR0026."

[LYS-PAR0028]
title = "a type alias without '='"
severity = "error"
area = "02-grammar"
summary = "`type Name = T`. Lyric 5's LYR-PAR0028."

[LYS-PAR0029]
title = "fields without ',' or a line end between them"
severity = "error"
area = "02-grammar"
summary = "The fields of a struct, a class, an initializer or a `with` end at `,` or at a line end. Lyric 5's LYR-PAR0029."

[LYS-PAR0031]
title = "a parameter or field without ':' before its type"
severity = "error"
area = "02-grammar"
summary = "`name: Type`. Lyric 5's LYR-PAR0031."

[LYS-PAR0034]
title = "a match arm without its '=>'"
severity = "error"
area = "09-patterns"
summary = "An arm is a pattern, a guard if any, `=>` and its value. Lyric 5's LYR-PAR0034."

[LYS-PAR0035]
title = "match arms without a separator"
severity = "error"
area = "09-patterns"
summary = "Arms stand apart by `,` or a line end. A line that begins with `.` goes on the line before (09 NL rule 3), so a value arm before a `.Variant` arm on the next line ends with `,`. Lyric 5's LYR-PAR0035."

[LYS-PAR0036]
title = "an if expression without 'else'"
severity = "error"
area = "02-grammar"
summary = "Where an `if` gives a value, both branches give one: the `else` is required. Lyric 5's LYR-PAR0036."

[LYS-PAR0037]
title = "a field in an initializer without '='"
severity = "error"
area = "02-grammar"
summary = "`Point { x = 1 }`, or `Point { x }` for `x = x`; a field of `with` always has its `=`. Lyric 5's LYR-PAR0037."

[LYS-PAR0045]
title = "nesting deeper than the parser carries"
severity = "error"
area = "02-grammar"
summary = "Expressions, blocks and prefix operators nest at most 64 levels: the parser recurses on its caller's stack. Lyric 5's LYR-PAR0045."

[LYS-PAR0047]
title = "'by' in an enum's list"
severity = "error"
area = "05-interfaces"
summary = "An enum delegates nothing: `I by field` stands in a struct's or a class's list. Lyric 5's LYR-PAR0047."

[LYS-PAR0049]
title = "several thrown types not in brackets"
severity = "error"
area = "06-errors"
summary = "A `throws` names two or more types without brackets: `throws [A, B]`. Lyric 5's LYR-PAR0049."

[LYS-PAR0050]
title = "a 'try?', 'try!' or 'try' with clauses right of an operator"
severity = "error"
area = "06-errors"
summary = "The forms that give a value of their own stand at the start of what they cover — a binding's value, an argument, the right of `=` — not right of an operator; put them in parentheses. Lyric 5's LYR-PAR0050."

[LYS-PAR0051]
title = "a clause after 'try?' or 'try!'"
severity = "error"
area = "06-errors"
summary = "`try?` and `try!` take every error themselves; a `catch` belongs to a plain `try`. Lyric 5's LYR-PAR0051."

[LYS-PAR0052]
title = "a 'using' that is not one 'let' with a value"
severity = "error"
area = "06-errors"
summary = "`using var` is written, or a `using` binding takes a pattern or has no value: a `using` is one `let` with a name and a value. Lyric 5's LYR-PAR0052."

[LYS-PAR0053]
title = "a visibility word where none belongs"
severity = "error"
area = "02-grammar"
summary = "`pub`, `internal` and `private` stand before a declaration only. Lyric 5's LYR-PAR0053."

[LYS-PAR0059]
title = "comparisons or equalities chained"
severity = "error"
area = "02-grammar"
summary = "`a < b < c` is refused rather than read left to right: write each comparison on its own and join them with `&&`. Lyric 5's LYR-PAR0059."

[LYS-PAR0060]
title = "a default on a local function's parameter"
severity = "error"
area = "03-types"
summary = "A local function is one closure: its parameters take no default. Lyric 5's LYR-PAR0060."

[LYS-PAR0900]
title = "a digit beyond its literal's base"
severity = "error"
area = "02-grammar"
summary = "A digit the literal's base does not have: `0b12`, `0o9`."

[LYS-PAR0901]
title = "a field in an enum"
severity = "error"
area = "02-grammar"
summary = "An enum holds variants and methods (spec 2 D3)."

[LYS-PAR0902]
title = "an entry of a map literal without ':'"
severity = "error"
area = "02-grammar"
summary = "`[\"a\": 1, \"b\": 2]`: every entry is `key: value` (spec 2 D5)."

# The checker (S2d). A code means what Lyric 5's LYR-SEM code of the same number means;
# Lyric-Script's own codes start at 0900.

[LYS-PKG0001]
title = "a manifest that is no TOML a manifest takes"
severity = "error"
area = "15-project"
summary = "The manifest `lyric-script.toml` is TOML, the part a manifest needs: a syntax error, a key or a table written twice, a float, a date or a time is refused at its line. Lyric 5's LYR-PKG0001."

[LYS-PKG0002]
title = "a manifest field missing or malformed"
severity = "error"
area = "15-project"
summary = "`[package]` is required, with a `name` (a lowercase letter, then lowercase letters, digits and `_`, not `std`), a semantic `version`, the `edition` \"1\" by default and a `toolchain` like \"1.1\" or \">=1.1\"; `description`, `license` and `repository` are strings, `authors` an array of strings; a dependency is `{ path = \"…\" }`. Lyric 5's LYR-PKG0002."

[LYS-PKG0003]
title = "a manifest key the toolchain does not know"
severity = "error"
area = "15-project"
summary = "A section or a key the manifest does not take is refused, as an unknown option is; a dependency written as a version alone is a registry's form, and Lyric-Script 1.0 has no registry. Lyric 5's LYR-PKG0003."

[LYS-PKG0004]
title = "a dependency whose folder holds no such package"
severity = "error"
area = "15-project"
summary = "A path dependency's folder holds a manifest naming the package under the name its dependent gives it; a folder without a manifest, or with another package, is refused at the dependency's line. Lyric 5's LYR-PKG0004."

[LYS-PKG0005]
title = "two packages of one name"
severity = "error"
area = "15-project"
summary = "A program holds one package of each name: two folders for one name are refused. Lyric 5's LYR-PKG0005."

[LYS-PKG0006]
title = "a revision or a package a repository does not have"
severity = "error"
area = "15-project"
summary = "A git dependency's tag, branch or commit is not in its repository, the repository holds no package at its root or another one, or a tag that is a version names a manifest of another version. Lyric 5's LYR-PKG0006."

[LYS-PKG0007]
title = "a repository that cannot be reached"
severity = "error"
area = "15-project"
summary = "A git dependency's repository cannot be cloned or fetched, or with `--offline` the cache does not hold what is asked for: a fault of the environment, with exit code 2. Lyric 5's LYR-PKG0007."

[LYS-PKG0008]
title = "content that is not what the lock holds"
severity = "error"
area = "15-project"
summary = "A revision the lock holds is read at its commit: content whose hash is not the lock's, or a locked commit the repository does not have, is refused. Lyric 5's LYR-PKG0008."

[LYS-PKG0009]
title = "a toolchain below what a package asks for"
severity = "error"
area = "15-project"
summary = "A package's `toolchain` names the least toolchain that builds it; a toolchain below it refuses the program with exit code 2, a fault of the environment and not of the script. A development build counts as its version. Lyric 5's LYR-PKG0009."

[LYS-PKG0010]
title = "packages that depend on each other"
severity = "error"
area = "15-project"
summary = "No package depends on itself, at once or through others: a cycle is refused with its path, `app -> geo -> app`. A package's dependencies are read before it, and a cycle has no first one. Lyric 5's LYR-PKG0010."

[LYS-PKG0011]
title = "a lock that --locked would change"
severity = "error"
area = "15-project"
summary = "Under `--locked` the lock is taken as it is and nothing is written: a revision the graph reads that the lock does not hold, an entry the graph no longer reads, or no lock where the program reads from git is refused. Lyric 5's LYR-PKG0011."

[LYS-RES0001]
title = "a name imported beside a declaration, or imported twice"
severity = "error"
area = "04-modules"
summary = "A module imports a name it declares itself, or two of its imports bind the same name. The declaration keeps its name; the import is reported. Lyric 5's LYR-RES0001."

[LYS-RES0003]
title = "an import of a module that does not exist"
severity = "error"
area = "04-modules"
summary = "An `import a.b` names a module no file provides: without a manifest, no `a/b.lyrs` below the entry script's folder; `import std.collections` names no module as a whole — its names are the prelude's, imported by name. Lyric 5's LYR-RES0003."

[LYS-RES0004]
title = "an imported name the module does not declare"
severity = "error"
area = "04-modules"
summary = "A selective import `import m { x };` asks for a name the module `m` neither declares nor passes on with `pub import`. Lyric 5's LYR-RES0004."

[LYS-RES0005]
title = "modules that import each other"
severity = "error"
area = "04-modules"
summary = "The imports of the program's modules form a cycle: a module imports, directly or through others, a module that imports it. The message names the cycle. Lyric 5's LYR-RES0005."

[LYS-RES0009]
title = "a name the place may not see"
severity = "error"
area = "04-modules"
summary = "An import or a use reaches a declaration of another module that is `private` to its file. Lyric 5's LYR-RES0009."

[LYS-RES0011]
title = "a declaration that takes a builtin type's name"
severity = "error"
area = "04-modules"
summary = "A top-level declaration is named like a builtin type: `struct int`, `fn string()`, `let bool = …` at the top of a module. Lyric 5's LYR-RES0011."

[LYS-RES0012]
title = "a name that is also a submodule"
severity = "error"
area = "04-modules"
summary = "A module declares or imports a name that is also the last segment of one of its submodules: `x` in `a.b` beside the file `a/b/x.lyrs`. Reported whether or not the submodule is imported. Lyric 5's LYR-RES0012."

[LYS-RES0014]
title = "an import of a package the manifest does not declare"
severity = "error"
area = "04-modules"
summary = "A module imports from its own package and from the packages its package's manifest declares, not from what those depend on. Lyric 5's LYR-RES0014."

[LYS-SEM0001]
title = "a value of another type than the place takes"
severity = "error"
area = "03-types"
summary = "An `int` widens where a `float` is taken; nothing else changes its type on its own. Lyric 5's LYR-SEM0001."

[LYS-SEM0002]
title = "a name that nothing in scope declares"
severity = "error"
area = "04-modules"
