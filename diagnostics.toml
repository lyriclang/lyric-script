# The diagnostic catalog of the Lyric-Script toolchain: every code it reports, in code order.
# The form of an entry is Lyric 5's (src/Lyric.Core/diagnostics.toml in lyriclang/lyric): title,
# severity, area (the chapter of the specification on lyric-spec's script branch), summary,
# explanation, example. Codes carry the prefix LYS-; a guard that holds this file against the
# toolchain comes with S11.

[LYS-CLI0001]
title = "an unknown command"
severity = "error"
area = "14-cli"
summary = "Reported when the first argument of `lyric-script` names no command. The exit code is 2."
explanation = '''
`lyric-script` takes a command as its first argument. A word it does not know stops it before
anything runs; `lyric-script help` lists the commands there are.
'''
example = '''
$ lyric-script frobnicate
error[LYS-CLI0001]: unknown command 'frobnicate'
  = help: lyric-script help lists the commands
'''

[LYS-ICE0001]
title = "the VM failed"
severity = "panic"
area = "17-host"
summary = "A fault of the Lyric-Script VM itself, not of the script: the VM's task ended by a panic of Lyric 5 or without a result. The host gets it as a panic; the VM stays usable. Worth a report."

[LYS-RT0001]
title = "integer division by zero"
severity = "panic"
area = "08-expressions"
summary = "An integer `/` or `%` has a zero divisor. The code and its meaning are Lyric 5's LYR-RT0001."

[LYS-RT0002]
title = "integer overflow"
severity = "panic"
area = "08-expressions"
summary = "An `int` operation's result does not fit 64 bits. The code and its meaning are Lyric 5's LYR-RT0002."

[LYS-RT0004]
title = "a null value used"
severity = "panic"
area = "03-types"
summary = "A field of `null` read or written. The code and its meaning are Lyric 5's LYR-RT0004."

[LYS-RT0006]
title = "stack overflow"
severity = "panic"
area = "17-host"
summary = "The script's calls nest deeper than the VM runs (10 000 frames). The code and its meaning are Lyric 5's LYR-RT0006."

[LYS-RT0008]
title = "panic called by the script"
severity = "panic"
area = "06-errors"
summary = "The script called `panic` with a message. The code and its meaning are Lyric 5's LYR-RT0008."

[LYS-ASM0001]
title = "a line of assembly text that cannot be read"
severity = "error"
area = "14-cli"
summary = "Reported by `lyric-script asm` for a .lyrsasm file with a faulty line: an unknown operation, a wrong number of operands, a missing label or function, a function without `end`. The message names the line. The exit code is 1."

[LYS-ASM0002]
title = "assembled code with a fault in its structure"
severity = "error"
area = "14-cli"
summary = "Reported by `lyric-script asm` when the assembled module fails the structure check: a register outside its file, a jump past the code, a call past the registers, a return of the wrong kind. The message names the function and the instruction. The exit code is 1."

[LYS-CLI0002]
title = "a command with the wrong arguments"
severity = "error"
area = "14-cli"
summary = "Reported when a command gets more or fewer arguments than it takes. The exit code is 2."

[LYS-CLI0003]
title = "a file that cannot be read"
severity = "error"
area = "14-cli"
summary = "Reported when a command cannot read the file it is given. The exit code is 2."
