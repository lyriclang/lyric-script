summary = "A type has a member of its own — written, from another extend block, inherited as an interface's default or left to a field — of the name a blanket block `extend<T :: [I]> T { … }` gives it. A call on the type reaches the type's; generic code that reaches the name through the block's constraints calls the block's, for that type too. Lyric 5's LYR-SEM0168."

[LYS-SEM0170]
title = "an extend block's type parameter bound by nothing"
severity = "error"
area = "05-interfaces"
summary = "A blanket block declares a type parameter that its target does not name and no constraint's fixation names, as `X` in `extend<I :: [Iterator], X> I`: the block reaches no type. Lyric 5's LYR-SEM0170."

[LYS-SEM0176]
title = "a name bound twice in one scope"
severity = "error"
area = "07-statements"
summary = "A scope binds a name once; an inner scope may bind it again. Lyric 5's LYR-SEM0176."

[LYS-SEM0197]
title = "more copies of generics than there may be"
severity = "error"
area = "03-types"
summary = "A program asks for more than 20 000 copies of generics, or a chain of copies each asking for the next. Lyric 5's LYR-SEM0197."

[LYS-SEM0226]
title = "a 'return' without the value the function returns"
severity = "error"
area = "07-statements"
summary = "The function has a result type; its `return` gives a value. Lyric 5's LYR-SEM0226."

[LYS-SEM0231]
title = "a static member called through its interface"
severity = "error"
area = "05-interfaces"
summary = "`Make.make(s)` is refused: the interface has no value to call it for; it is called on a type that conforms, `Item.make(s)`, or through a type parameter, `T.make(s)`. Lyric 5's LYR-SEM0231."

[LYS-SEM0900]
title = "a width type of Lyric 5"
severity = "error"
area = "03-types"
summary = "Lyric-Script has one integer type, `int`, and one float type, `float` (spec 3 rule 1)."

[LYS-SEM0901]
title = "'var' on a struct's field"
severity = "error"
area = "03-types"
summary = "A struct's fields are never written; a class has `var` fields (spec 3 rule 3)."

[LYS-SEM0902]
title = "'return' outside a function"
severity = "error"
area = "07-statements"
summary = "A script ends at its end, or with `exit(n)` (spec 7 rule 1)."

[LYS-SEM0903]
title = "a global of the script without a value"
severity = "error"
area = "07-statements"
summary = "A `let` or `var` of the script's outermost code takes its value where it is declared: a function may read it before any statement assigns it (spec 7)."

# What the plan builds later, and the toolchain's own faults.

[LYS-SEM0904]
title = "a jump out of a defer's body"
severity = "error"
area = "06-errors"
summary = "A `return`, or a `break` or `continue` to a loop outside it, stands in a defer's body. A defer runs where its scope is left — on an error too — and goes on from there; a jump out of it would drop that way. Script's own; Lyric 5 does not say."

[LYS-SEM0905]
title = "a statement of an imported module"
severity = "warning"
area = "04-modules"
summary = "An imported module's statement other than a `let` or a `var` does not run: only the entry module runs its statements; an imported one gives its declarations and its bindings, filled before the entry's code. Script's own; a Lyric 5 module has no statements."

[LYS-SEM0906]
title = "two entries"
severity = "error"
area = "04-modules"
summary = "The entry module runs statements and declares `fn main`: either is an entry, both are two. Keep the statements, or move them into `main`. Script's own: a Lyric 5 module has no statements."

[LYS-NYI0001]
title = "a form a later milestone builds"
severity = "error"
area = "16-diagnostics"
summary = "The form is part of Lyric-Script 1.0, and the toolchain does not build it yet; the message names the milestone of the plan. The code leaves the toolchain before 1.0."

[LYS-ICE0002]
title = "the compiler made faulty bytecode"
severity = "error"
area = "17-host"
summary = "The bytecode the compiler made fails the VM's check of its structure: a fault of the toolchain, not of the script. Worth a report."

[LYS-RT0009]
title = "a conversion to char of no Unicode scalar value"
severity = "panic"
area = "08-expressions"
summary = "An `int` converted with `as char` is negative, beyond 0x10FFFF, or a surrogate. The code and its meaning are Lyric 5's LYR-RT0009."

[LYS-RT0010]
title = "'try!' on an error"
severity = "panic"
area = "06-errors"
summary = "Something under `try!` threw: the script ends with a panic that gives the error's message, exit code 101. The code and its meaning are Lyric 5's LYR-RT0010."

[LYS-RT0011]
title = "an assertion that fails"
severity = "panic"
area = "06-errors"
summary = "`assert(condition) { message }` found the condition false: `assertion failed:`, the condition as written and the message. The code and its meaning are Lyric 5's LYR-RT0011."

[LYS-RT0012]
title = "unreachable reached"
severity = "panic"
area = "06-errors"
summary = "`unreachable(message)` ran: `unreachable`, and the message where one is given. The code and its meaning are Lyric 5's LYR-RT0012."

[LYS-RT0013]
title = "not implemented"
severity = "panic"
area = "06-errors"
summary = "`todo(message)` ran: `not implemented`, and the message where one is given. The code and its meaning are Lyric 5's LYR-RT0013."

[LYS-RT0014]
title = "a coroutine misused"
severity = "panic"
area = "10-concurrency"
summary = "A coroutine is used against its rules: pulled or closed while it runs, a `yield` where no coroutine runs or after the coroutine was closed, or a yield of another type than the running coroutine's. The code and its meaning are Lyric 5's LYR-RT0014."

[LYS-RT0016]
title = "a collection changed while it was walked"
severity = "panic"
area = "12-stdlib"
summary = "A list's length changed — a push, a pop, an insert, a removal — while a `for` loop walked it. The next step of the walk panics; collect the changes and apply them after the loop. The code and its meaning are Lyric 5's LYR-RT0016."

[LYS-RT0018]
title = "a deadlock"
severity = "panic"
area = "10-concurrency"
summary = "Every task of the run waits — for another task — and nothing can wake one: the run panics, exit code 101. The code and its meaning are Lyric 5's LYR-RT0018."

[LYS-CLI0004]
title = "an unknown option"
severity = "error"
area = "14-cli"
summary = "A command is given an option it does not know. The exit code is 2."

[LYS-CLI0005]
title = "a package without a program"
severity = "error"
area = "14-cli"
summary = "`lyric-script run` or `check` without a file, in a package's folder, takes its `src/main.lyrs`; a package without one has no program to name. The exit code is 2."

[LYS-CLI0006]
title = "an update of a package not read from git"
severity = "error"
area = "14-cli"
summary = "`lyric-script update` names a package that no git dependency of the program is. The exit code is 2."

[LYS-CLI0007]
title = "an --allow of no rights"
severity = "error"
area = "14-cli"
summary = "`--allow` names classes of rights between commas — file, net, process, os, native —; another word is refused. The exit code is 2."
